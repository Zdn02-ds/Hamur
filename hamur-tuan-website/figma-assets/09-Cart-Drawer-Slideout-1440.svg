<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      .font-brand { font-family: 'Montserrat', sans-serif; font-weight: 900; }
      .font-body { font-family: 'Plus Jakarta Sans', sans-serif; }
      .shadow-drawer { filter: drop-shadow(-10px 0 35px rgba(0, 0, 0, 0.35)); }
      .shadow-wa { filter: drop-shadow(0 4px 15px rgba(37, 211, 102, 0.4)); }
    </style>
  </defs>

  <!-- Dimmed Backdrop Overlay -->
  <rect width="1440" height="1024" fill="#050203" fill-opacity="0.65"/>

  <!-- Slide-out Drawer Panel (Pinned to Right: x=1020, y=0, w=420, h=1024) -->
  <g id="Cart-Drawer" transform="translate(1020, 0)" class="shadow-drawer">
    <rect width="420" height="1024" fill="#FFFFFF"/>

    <!-- Drawer Header -->
    <rect width="420" height="75" fill="#3C150C"/>
    <text x="30" y="46" class="font-brand" font-size="20" fill="#F2C791" letter-spacing="1">KERANJANG PESANAN</text>
    <text x="385" y="47" class="font-body" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">✕</text>

    <!-- Drawer Items List -->
    <g transform="translate(24, 100)">
      <!-- Item 1: Kokuto Latte -->
      <g transform="translate(0, 0)">
        <rect width="372" height="88" rx="14" fill="#FBF8F3" stroke="#3C150C" stroke-opacity="0.1"/>
        <text x="20" y="32" class="font-brand" font-size="15" fill="#3C150C">Kokuto Latte Aren</text>
        <text x="20" y="52" class="font-body" font-size="12" fill="#996A3D">Varian: Dingin (Ice)</text>
        <text x="20" y="72" class="font-brand" font-size="14" fill="#3C150C">Rp 18.000</text>

        <!-- Stepper Controls (+ / -) -->
        <g transform="translate(260, 28)">
          <rect width="28" height="28" rx="14" fill="#FFFFFF" stroke="#3C150C" stroke-opacity="0.2"/>
          <text x="14" y="19" class="font-body" font-size="14" font-weight="800" fill="#3C150C" text-anchor="middle">-</text>
          
          <text x="46" y="20" class="font-body" font-size="14" font-weight="800" fill="#3C150C" text-anchor="middle">1</text>

          <g transform="translate(64, 0)">
            <rect width="28" height="28" rx="14" fill="#3C150C"/>
            <text x="14" y="19" class="font-body" font-size="14" font-weight="800" fill="#F2C791" text-anchor="middle">+</text>
          </g>
        </g>
      </g>

      <!-- Item 2: Mix Platter -->
      <g transform="translate(0, 104)">
        <rect width="372" height="88" rx="14" fill="#FBF8F3" stroke="#3C150C" stroke-opacity="0.1"/>
        <text x="20" y="32" class="font-brand" font-size="15" fill="#3C150C">Mix Platter Hamur</text>
        <text x="20" y="52" class="font-body" font-size="12" fill="#996A3D">Porsi Sharing Komplit</text>
        <text x="20" y="72" class="font-brand" font-size="14" fill="#3C150C">Rp 20.000</text>

        <!-- Stepper Controls -->
        <g transform="translate(260, 28)">
          <rect width="28" height="28" rx="14" fill="#FFFFFF" stroke="#3C150C" stroke-opacity="0.2"/>
          <text x="14" y="19" class="font-body" font-size="14" font-weight="800" fill="#3C150C" text-anchor="middle">-</text>
          
          <text x="46" y="20" class="font-body" font-size="14" font-weight="800" fill="#3C150C" text-anchor="middle">1</text>

          <g transform="translate(64, 0)">
            <rect width="28" height="28" rx="14" fill="#3C150C"/>
            <text x="14" y="19" class="font-body" font-size="14" font-weight="800" fill="#F2C791" text-anchor="middle">+</text>
          </g>
        </g>
      </g>

      <!-- Item 3: Mie Hamur Tuan -->
      <g transform="translate(0, 208)">
        <rect width="372" height="88" rx="14" fill="#FBF8F3" stroke="#3C150C" stroke-opacity="0.1"/>
        <text x="20" y="32" class="font-brand" font-size="15" fill="#3C150C">Mie Hamur Tuan</text>
        <text x="20" y="52" class="font-body" font-size="12" fill="#996A3D">Chili Oil &amp; Telur Soft</text>
        <text x="20" y="72" class="font-brand" font-size="14" fill="#3C150C">Rp 18.000</text>

        <!-- Stepper Controls -->
        <g transform="translate(260, 28)">
          <rect width="28" height="28" rx="14" fill="#FFFFFF" stroke="#3C150C" stroke-opacity="0.2"/>
          <text x="14" y="19" class="font-body" font-size="14" font-weight="800" fill="#3C150C" text-anchor="middle">-</text>
          
          <text x="46" y="20" class="font-body" font-size="14" font-weight="800" fill="#3C150C" text-anchor="middle">2</text>

          <g transform="translate(64, 0)">
            <rect width="28" height="28" rx="14" fill="#3C150C"/>
            <text x="14" y="19" class="font-body" font-size="14" font-weight="800" fill="#F2C791" text-anchor="middle">+</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Drawer Footer (Sticky at bottom) -->
    <g transform="translate(0, 840)">
      <rect width="420" height="184" fill="#FBF8F3"/>
      <line x1="0" y1="0" x2="420" y2="0" stroke="#3C150C" stroke-opacity="0.1"/>

      <!-- Subtotal Calculation -->
      <g transform="translate(30, 35)">
        <text x="0" y="0" class="font-brand" font-size="16" fill="#3C150C">Total Pesanan (4 Item):</text>
        <text x="360" y="0" class="font-brand" font-size="20" fill="#3C150C" text-anchor="end">Rp 56.000</text>
      </g>

      <!-- 1-Click WhatsApp Checkout -->
      <g transform="translate(30, 70)">
        <rect width="360" height="52" rx="26" fill="#25D366" class="shadow-wa"/>
        <text x="180" y="32" class="font-body" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">💬 Kirim Pesanan ke WhatsApp</text>
      </g>
      <text x="210" y="150" class="font-body" font-size="11" fill="#695E59" text-anchor="middle">Pesanan akan terformat otomatis &amp; langsung dikirim ke kasir</text>
    </g>
  </g>
</svg>
