<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      .font-brand { font-family: 'Montserrat', sans-serif; font-weight: 900; }
      .font-body { font-family: 'Plus Jakarta Sans', sans-serif; }
      .shadow-modal { filter: drop-shadow(0 25px 60px rgba(0, 0, 0, 0.45)); }
      .shadow-btn { filter: drop-shadow(0 4px 14px rgba(37, 211, 102, 0.35)); }
    </style>
    <clipPath id="modalImgClip">
      <rect width="320" height="520" rx="24"/>
    </clipPath>
  </defs>

  <!-- Dimmed Dark Backdrop Overlay (70% opacity) -->
  <rect width="1440" height="1024" fill="#050203" fill-opacity="0.75"/>

  <!-- Modal Dialog Container (Centered: x=330, y=252, w=780, h=520) -->
  <g id="Modal-Dialog" transform="translate(330, 252)" class="shadow-modal">
    <!-- Card White Background -->
    <rect width="780" height="520" rx="24" fill="#FFFFFF"/>

    <!-- Left Column: High-Res Food Photo Column -->
    <g transform="translate(0, 0)">
      <rect width="320" height="520" rx="24" fill="#2b0e07"/>
      <!-- Clip and show food image -->
      <g clip-path="url(#modalImgClip)">
        <rect width="320" height="520" fill="#2b0e07"/>
        <text x="160" y="240" font-size="64" text-anchor="middle">🍜</text>
        <text x="160" y="280" class="font-brand" font-size="16" fill="#F2C791" text-anchor="middle">FOTO SIGNATURE</text>
        <!-- Overlay gradient -->
        <rect y="360" width="320" height="160" fill="#1b0703" opacity="0.6"/>
      </g>
      <!-- Divider border -->
      <line x1="320" y1="0" x2="320" y2="520" stroke="#3C150C" stroke-opacity="0.1"/>
    </g>

    <!-- Close Button (X) -->
    <g transform="translate(724, 16)">
      <circle cx="18" cy="18" r="18" fill="#F4EFEA"/>
      <text x="18" y="24" class="font-body" font-size="18" font-weight="700" fill="#3C150C" text-anchor="middle">✕</text>
    </g>

    <!-- Right Column: Information & Controls -->
    <g transform="translate(350, 40)">
      <!-- Category & Badge -->
      <text x="0" y="16" class="font-body" font-size="11" font-weight="800" fill="#996A3D" letter-spacing="1">MAIN COURSE FOOD</text>
      <rect x="140" y="2" width="95" height="22" rx="11" fill="#3C150C"/>
      <text x="187" y="17" class="font-brand" font-size="9" fill="#F2C791" text-anchor="middle">SIGNATURE DISH</text>

      <!-- Title & Price -->
      <text x="0" y="58" class="font-brand" font-size="28" fill="#3C150C">Mie Hamur Tuan</text>
      <text x="0" y="92" class="font-brand" font-size="24" fill="#3C150C">Rp 18.000</text>

      <!-- Description -->
      <text x="0" y="125" class="font-body" font-size="13" fill="#695E59">
        <tspan x="0" dy="0">Mie kenyal buatan khusus yang dibumbui minyak cabai aromatik,</tspan>
        <tspan x="0" dy="20">topping suwiran ayam gurih, taburan daun bawang segar, telur rebus</tspan>
        <tspan x="0" dy="20">lembut, dan kerupuk pangsit renyah khas racikan Hamur Tuan.</tspan>
      </text>

      <!-- Tasting Profile -->
      <g transform="translate(0, 185)">
        <rect width="390" height="60" rx="12" fill="#FBF8F3" stroke="#3C150C" stroke-opacity="0.08"/>
        <text x="16" y="22" class="font-body" font-size="10" font-weight="800" fill="#3C150C" letter-spacing="0.5">KARAKTER RASA (TASTING NOTES):</text>
        
        <g transform="translate(16, 32)">
          <rect width="80" height="20" rx="10" fill="#FFFFFF" stroke="#3C150C" stroke-opacity="0.15"/>
          <text x="40" y="14" class="font-body" font-size="9" font-weight="700" fill="#996A3D" text-anchor="middle">Chili Oil</text>

          <rect x="90" width="105" height="20" rx="10" fill="#FFFFFF" stroke="#3C150C" stroke-opacity="0.15"/>
          <text x="142" y="14" class="font-body" font-size="9" font-weight="700" fill="#996A3D" text-anchor="middle">Savory Chicken</text>

          <rect x="205" width="85" height="20" rx="10" fill="#FFFFFF" stroke="#3C150C" stroke-opacity="0.15"/>
          <text x="247" y="14" class="font-body" font-size="9" font-weight="700" fill="#996A3D" text-anchor="middle">Crispy Pangsit</text>
        </g>
      </g>

      <!-- Hot/Ice Toggle -->
      <g transform="translate(0, 265)">
        <text x="0" y="12" class="font-body" font-size="11" font-weight="800" fill="#3C150C">PILIHAN SUHU / SAJIAN:</text>
        <g transform="translate(0, 22)">
          <rect width="185" height="38" rx="10" fill="#3C150C"/>
          <text x="92" y="24" class="font-body" font-size="12" font-weight="800" fill="#F2C791" text-anchor="middle">🧊 Dingin (Ice)</text>

          <g transform="translate(195, 0)">
            <rect width="185" height="38" rx="10" fill="#FBF8F3" stroke="#3C150C" stroke-opacity="0.15"/>
            <text x="92" y="24" class="font-body" font-size="12" font-weight="700" fill="#695E59" text-anchor="middle">☕ Panas (Hot)</text>
          </g>
        </g>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(0, 370)">
        <!-- Pesan via WhatsApp -->
        <rect width="185" height="48" rx="12" fill="#25D366" class="shadow-btn"/>
        <text x="92" y="30" class="font-body" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">💬 Pesan via WA</text>

        <!-- Tambah ke Keranjang -->
        <g transform="translate(195, 0)">
          <rect width="185" height="48" rx="12" fill="#3C150C"/>
          <text x="92" y="30" class="font-body" font-size="13" font-weight="800" fill="#F2C791" text-anchor="middle">🛒 + Keranjang</text>
        </g>
      </g>
    </g>
  </g>
</svg>
