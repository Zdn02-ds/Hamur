      .font-body { font-family: 'Plus Jakarta Sans', sans-serif; }
      .font-serif { font-family: 'Playfair Display', Georgia, serif; font-style: italic; }
      .shadow-card { filter: drop-shadow(0 10px 25px rgba(60, 21, 12, 0.08)); }
