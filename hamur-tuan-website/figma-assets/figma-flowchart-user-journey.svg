<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1150" width="1000" height="1150">
  <defs>
    <style>
      .node-txt { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; fill: #3C150C; text-anchor: middle; }
      .node-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; fill: #695E59; text-anchor: middle; }
      .flow-arrow { stroke: #996A3D; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pill-txt { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 15px; fill: #FFFFFF; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#996A3D"/>
    </marker>
  </defs>

  <rect width="1000" height="1150" fill="#FBF8F3" rx="20"/>

  <text x="500" y="50" font-family="'Montserrat', sans-serif" font-weight="900" font-size="24" fill="#3C150C" text-anchor="middle">HAMUR TUAN — FIGMA USER FLOW &amp; PROTOTYPE MAP</text>

  <!-- START NODE -->
  <g transform="translate(425, 80)">
    <rect width="150" height="48" rx="24" fill="#3C150C"/>
    <text x="75" y="30" class="pill-txt">Start</text>
  </g>

  <!-- Line Start to Home -->
  <line x1="500" y1="128" x2="500" y2="168" class="flow-arrow" marker-end="url(#arrow)"/>

  <!-- HOME PAGE NODE -->
  <g transform="translate(380, 170)">
    <rect width="240" height="60" rx="12" fill="#FFFFFF" stroke="#3C150C" stroke-width="2"/>
    <text x="120" y="32" class="node-txt">Home Page</text>
    <text x="120" y="48" class="node-sub">Hero &amp; Value Proposition</text>
  </g>

  <!-- Line Home to Pilih Info -->
  <line x1="500" y1="230" x2="500" y2="280" class="flow-arrow" marker-end="url(#arrow)"/>

  <!-- PILIH INFORMASI DECISION / HUB -->
  <g transform="translate(380, 282)">
    <rect width="240" height="54" rx="10" fill="#F2C791" stroke="#996A3D" stroke-width="2"/>
    <text x="120" y="33" class="node-txt" font-weight="800">PILIH INFORMASI</text>
  </g>

  <!-- Branch lines -->
  <!-- Left to Menu -->
  <path d="M 380 309 L 180 309 L 180 380" class="flow-arrow" marker-end="url(#arrow)"/>
  <!-- Center to Lokasi -->
  <line x1="500" y1="336" x2="500" y2="380" class="flow-arrow" marker-end="url(#arrow)"/>
  <!-- Right to Tentang Kami -->
  <path d="M 620 309 L 820 309 L 820 380" class="flow-arrow" marker-end="url(#arrow)"/>

  <!-- ================= BRANCH 1: MENU ================= -->
  <g transform="translate(80, 385)">
    <rect width="200" height="50" rx="10" fill="#FFFFFF" stroke="#3C150C" stroke-width="1.5"/>
    <text x="100" y="31" class="node-txt">Menu</text>
  </g>

  <line x1="180" y1="435" x2="180" y2="475" class="flow-arrow" marker-end="url(#arrow)"/>

  <g transform="translate(60, 480)">
    <rect width="240" height="54" rx="8" fill="#FAF5EF" stroke="#996A3D" stroke-width="1"/>
    <text x="120" y="26" class="node-txt" font-size="12">Lihat daftar &amp; menu harga</text>
    <text x="120" y="42" class="node-sub">Kategori, Search &amp; Price Tags</text>
  </g>

  <line x1="180" y1="534" x2="180" y2="575" class="flow-arrow" marker-end="url(#arrow)"/>

  <g transform="translate(60, 580)">
    <rect width="240" height="54" rx="8" fill="#FAF5EF" stroke="#996A3D" stroke-width="1"/>
    <text x="120" y="26" class="node-txt" font-size="12">Lihat detail informasi produk</text>
    <text x="120" y="42" class="node-sub">Modal, Tasting Notes, Hot/Ice</text>
  </g>

  <!-- ================= BRANCH 2: LOKASI ================= -->
  <g transform="translate(400, 385)">
    <rect width="200" height="50" rx="10" fill="#FFFFFF" stroke="#3C150C" stroke-width="1.5"/>
    <text x="100" y="31" class="node-txt">Lokasi</text>
  </g>

  <line x1="500" y1="435" x2="500" y2="475" class="flow-arrow" marker-end="url(#arrow)"/>

  <g transform="translate(370, 480)">
    <rect width="260" height="54" rx="8" fill="#FAF5EF" stroke="#996A3D" stroke-width="1"/>
    <text x="130" y="26" class="node-txt" font-size="12">Lihat alamat, peta &amp; jam buka</text>
    <text x="130" y="42" class="node-sub">Live Status &amp; Fasilitas Cafe</text>
  </g>

  <!-- ================= BRANCH 3: TENTANG KAMI ================= -->
  <g transform="translate(720, 385)">
    <rect width="200" height="50" rx="10" fill="#FFFFFF" stroke="#3C150C" stroke-width="1.5"/>
    <text x="100" y="31" class="node-txt">Tentang Kami</text>
  </g>

  <line x1="820" y1="435" x2="820" y2="475" class="flow-arrow" marker-end="url(#arrow)"/>

  <g transform="translate(700, 480)">
    <rect width="240" height="54" rx="8" fill="#FAF5EF" stroke="#996A3D" stroke-width="1"/>
    <text x="120" y="26" class="node-txt" font-size="12">Lihat info &amp; cerita brand</text>
    <text x="120" y="42" class="node-sub">Hamur Walikan &amp; Visi Misi</text>
  </g>

  <!-- Convergence to CTA and "Pilih Halaman Lain" -->
  <!-- Menu to CTA -->
  <path d="M 180 634 L 180 720 L 415 720" class="flow-arrow" marker-end="url(#arrow)"/>

  <!-- Lokasi to CTA -->
  <line x1="500" y1="534" x2="500" y2="675" class="flow-arrow" marker-end="url(#arrow)"/>

  <!-- Tentang Kami to "Pilih Halaman Lain" -->
  <line x1="820" y1="534" x2="820" y2="685" class="flow-arrow" marker-end="url(#arrow)"/>

  <!-- CTA DIAMOND / CARD -->
  <g transform="translate(420, 680)">
    <polygon points="80,0 160,45 80,90 0,45" fill="#3C150C"/>
    <text x="80" y="50" class="pill-txt" font-size="14">CTA</text>
  </g>

  <!-- PILIH HALAMAN LAIN (DECISION DIAMOND) -->
  <g transform="translate(740, 680)">
    <polygon points="80,0 160,45 80,90 0,45" fill="#996A3D"/>
    <text x="80" y="45" class="pill-txt" font-size="11">PILIH HALAMAN</text>
    <text x="80" y="60" class="pill-txt" font-size="11">LAIN</text>
  </g>

  <!-- Loop back from "Pilih Halaman Lain" to "Pilih Informasi" -->
  <path d="M 900 725 L 960 725 L 960 309 L 630 309" class="flow-arrow" marker-end="url(#arrow)"/>
  <text x="965" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#996A3D" transform="rotate(90 965 520)">Loop Back to Pilih Informasi</text>

  <!-- Line CTA to End -->
  <line x1="500" y1="770" x2="500" y2="840" class="flow-arrow" marker-end="url(#arrow)"/>

  <!-- Line Pilih Halaman Lain to End if user chooses to proceed -->
  <path d="M 820 770 L 820 810 L 525 810" class="flow-arrow"/>

  <!-- END NODE -->
  <g transform="translate(425, 845)">
    <rect width="150" height="48" rx="24" fill="#3C150C"/>
    <text x="75" y="30" class="pill-txt">End</text>
  </g>
</svg>
