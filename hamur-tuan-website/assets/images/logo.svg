<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" flood-color="#000000"/>
    </filter>
    <path id="hamur-arc" d="M 120 120 A 105 105 0 0 1 280 120" fill="none" />
  </defs>

  <!-- House Shaped Badge with Rounded Corners -->
  <path d="M 200 35 
           C 210 35, 218 40, 225 46
           L 345 142
           C 358 153, 365 168, 365 185
           L 365 370
           C 365 392, 347 410, 325 410
           L 75 410
           C 53 410, 35 392, 35 370
           L 35 185
           C 35 168, 42 153, 55 142
           L 175 46
           C 182 40, 190 35, 200 35 Z" 
        fill="#3C150C" 
        filter="url(#subtle-shadow)"/>

  <!-- Curved "HAMUR" Text along top arch -->
  <text fill="#F2C791" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="9">
    <textPath href="#hamur-arc" startOffset="50%" text-anchor="middle">
      HAMUR
    </textPath>
  </text>

  <!-- Center Decorative Monogram 'H' (Batik & Cursive Motif) -->
  <g transform="translate(140, 160)" stroke="#F2C791" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Loop and Stem -->
    <path d="M 45 42
             C 45 15, 10 15, 10 38
             C 10 65, 52 75, 52 105
             C 52 135, 12 135, 12 110" />
    <!-- Cross Tie Loop -->
    <path d="M 28 72 C 45 72, 75 72, 92 72" stroke-width="8" />
    <!-- Right Loop and Stem -->
    <path d="M 75 42
             C 75 15, 110 15, 110 38
             C 110 65, 68 75, 68 105
             C 68 135, 108 135, 108 110" />
  </g>

  <!-- Left and Right Accent Dots -->
  <circle cx="88" cy="235" r="9" fill="#F2C791" />
  <circle cx="312" cy="235" r="9" fill="#F2C791" />

  <!-- Bottom "TUAN" Text -->
  <text x="200" y="365" 
        fill="#F2C791" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="12" 
        text-anchor="middle">TUAN</text>
</svg>
